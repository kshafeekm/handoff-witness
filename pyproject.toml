[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-witness"
version = "0.3.0"
description = "Research prototype for request provenance across human–agent browser handoffs"
requires-python = ">=3.11"
dependencies = ["cryptography>=49", "webauthn>=3.0.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.50"]

[project.scripts]
handoff-witness = "handoff_witness.cli:main"

[tool.setuptools.packages.find]
include = ["handoff_witness*"]

[tool.setuptools.package-data]
handoff_witness = ["review_assets/*.html", "review_assets/*.js", "review_assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
